[project]
name = "documind"
version = "0.1.0"
description = "RAG knowledge base API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pydantic[email]>=2.13.5",
    "python-multipart>=0.0.32",
    "pypdf>=6.20.1",
    "python-docx>=1.2.0",
    "tiktoken>=0.14.0",
    "anyio>=4.15.1",
    "pgvector>=0.5.1",
    "httpx>=0.28.1",
    "celery[redis]>=5.6.3",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.40.0",
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole test session, so async fixtures (DB engine)
# and async tests share a loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import order)
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "ASYNC", # async pitfalls
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...) in argument defaults is the idiomatic pattern.
extend-immutable-calls = ["fastapi.Depends"]
