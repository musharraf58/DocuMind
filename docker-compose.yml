# Settings shared by the API and the worker (same image, same config).
x-app: &app
  build:
    context: .
    # The dev image includes pytest, ruff and the tests (see the Dockerfile).
    target: dev
  image: documind-app
  env_file: .env
  environment:
    # Inside the compose network, services reach each other by service name,
    # not localhost.
    DATABASE_URL: postgresql+asyncpg://documind:documind@postgres:5432/documind
    REDIS_URL: redis://redis:6379/0
    STORAGE_PATH: /data/storage
  volumes:
    # Uploaded files survive container rebuilds. The worker reads them too.
    - storage_data:/data/storage

services:
  api:
    <<: *app
    ports:
      - "8000:8000"
    # Apply migrations, then start the server. --no-proxy-headers: uvicorn must
    # not rewrite the client address from X-Forwarded-For on its own; the app
    # decides with TRUSTED_PROXY_COUNT (see "Security and Limits" in the README).
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Background jobs: processes uploaded documents, one at a time, and runs the
  # sweeper every minute (Celery beat, started inside the worker with --beat).
  worker:
    <<: *app
    command: >-
      celery -A app.workers.celery_app worker --beat --concurrency=1
      --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      # The API applies migrations on start; wait until it's up.
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    # On "docker compose stop" Celery stops taking jobs and finishes the
    # current one (warm shutdown). If that takes longer than this, the job is
    # killed; the sweeper requeues the document once its heartbeat goes stale.
    stop_grace_period: 2m
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: documind
      POSTGRES_PASSWORD: documind
      POSTGRES_DB: documind
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documind -d documind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  storage_data:
